<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anthony's AI Products</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      color: #222;
    }

    header {
      text-align: center;
      padding: 70px 20px 40px;
    }

    header h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    header p {
      color: #666;
      font-size: 18px;
    }

    .product {
      max-width: 850px;
      margin: 20px auto 80px;
      background: white;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .product h2 {
      font-size: 32px;
      margin-top: 0;
    }

    .description {
      font-size: 18px;
      line-height: 1.7;
      color: #555;
    }

    .video {
      background: #111;
      color: white;
      height: 420px;
      border-radius: 12px;
      margin-top: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 22px;
    }

    .buttons {
      margin-top: 30px;
    }

    .download {
      display: inline-block;
      padding: 14px 24px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 17px;
    }

    .download:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

<header>
  <h1>Anthony's AI Products</h1>
  <p>AI products, experiments and creative projects.</p>
</header>

<div class="product">

  <h2>My First AI Product</h2>

  <p class="description">
    This is my first AI product showcase.
    Here I will introduce what the product does,
    demonstrate how it works, and provide a download link.
  </p>

  <div class="video">
    ▶ Product Demo Video
  </div>

  <div class="buttons">
    <a class="download" href="#">
      Download App
    </a>
  </div>

</div>

</body>
</html>
