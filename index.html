<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f0ec">
  <meta name="description" content="Anthony 的独立产品作品集。用 AI 把想法做成简单、好用的产品。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Anthony · 独立产品">
  <meta property="og:description" content="把想法，做进日常。">
  <meta name="color-scheme" content="light dark">
  <title>Anthony · 独立产品</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/site.css?v=20261027-inline">
  <link rel="stylesheet" href="assets/css/inline.css?v=20261027-inline">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('anthony-theme');
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : (dark ? 'dark' : 'light');
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <div class="ambient" aria-hidden="true">
    <i class="ambient-blob ambient-a"></i>
    <i class="ambient-blob ambient-b"></i>
    <i class="ambient-blob ambient-c"></i>
    <span class="ambient-sheen"></span>
  </div>

  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" id="brandMark">A</span>
        <span class="brand-copy">
          <strong id="brandName">Anthony</strong>
        </span>
      </div>

      <div class="header-actions">
        <button class="button quiet" type="button" id="editCurrent">编辑</button>
        <button class="icon-button theme-toggle" type="button" id="themeToggle" aria-label="切换到深色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.5 14.2A8.4 8.4 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="preview-badge hidden" id="previewBadge">草稿 <a href="index.html">查看已发布版本</a></div>

  <div class="inline-editor-tools" id="inlineEditorTools"></div>

  <main class="stage" id="main">
    <div class="card-mount" id="cardMount" aria-busy="true">
      <div class="card-skeleton" aria-hidden="true">
        <div class="skeleton-copy">
          <span class="skeleton-line short"></span>
          <span class="skeleton-line title"></span>
          <span class="skeleton-line med"></span>
          <span class="skeleton-line med"></span>
          <span class="skeleton-line chip"></span>
        </div>
        <div class="skeleton-screen"></div>
      </div>
    </div>
  </main>

  <nav class="product-nav" id="productNav" aria-label="切换作品"></nav>

  <div class="home-dock hidden" id="homeDock" aria-hidden="true">
    <div class="orb-stage" id="orbStage">
      <span class="orb-halo" aria-hidden="true"></span>
      <span class="orb-dispersion" aria-hidden="true"></span>
      <span class="orb-burst" aria-hidden="true"></span>
      <button class="home-orb" type="button" id="homeOrb" aria-label="作品导航：左右拖动切换产品，单点播放视频，双击编辑当前产品，长按新增产品">
        <span class="home-sphere" aria-hidden="true">
          <span class="sphere-surface">
            <i class="sphere-flow sphere-flow-a"></i>
            <i class="sphere-flow sphere-flow-b"></i>
            <i class="sphere-flow sphere-flow-c"></i>
            <i class="sphere-flow sphere-flow-d"></i>
          </span>
          <span class="sphere-depth"></span>
          <span class="sphere-caustic"></span>
          <span class="sphere-prism"></span>
          <span class="sphere-rim"><i></i></span>
          <span class="sphere-lens"></span>
          <span class="sphere-glint"></span>
        </span>
      </button>
      <span class="orb-floor" aria-hidden="true"></span>
      <span class="hold-ring" aria-hidden="true"></span>
    </div>
  </div>

  <div class="sr-only" id="liveRegion" aria-live="polite" aria-atomic="true"></div>

  <dialog class="sheet-dialog" id="sheetDialog" aria-labelledby="sheetTitle" tabindex="-1">
    <div class="sheet" id="sheetContent"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript-card">
      <strong>需要启用 JavaScript</strong>
      <p>这个作品集使用 JavaScript 加载内容与交互，请在浏览器中启用 JavaScript 后刷新。</p>
    </div>
  </noscript>

  <script src="assets/js/utils.js?v=20261027-inline"></script>
  <script src="assets/js/site.js?v=20261027-inline"></script>
</body>
</html>
